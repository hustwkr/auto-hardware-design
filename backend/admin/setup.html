<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8">
<link rel="icon" type="image/png" href="/hwlogo.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>设置管理员密码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;border-radius:12px;padding:24px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:400px}
h1{font-size:1.2rem;margin-bottom:6px;text-align:center;color:#1e293b}
p.desc{font-size:.85rem;color:#64748b;text-align:center;margin-bottom:20px}
.form-group{margin-bottom:16px}
label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.9rem}
input:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
button{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:.95rem;cursor:pointer;margin-top:4px}
button:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:.85rem;margin-top:8px;text-align:center}
.msg.err{color:#ef4444}
.msg.ok{color:#10b981}
</style></head>
<body>
<div class="card">
<h1>🔐 首次使用设置</h1>
<p class="desc">请设置管理员密码，密码至少 8 位</p>
<div class="form-group"><label>密码</label><input type="password" id="pw" placeholder="输入管理员密码" autocomplete="new-password"></div>
<div class="form-group"><label>确认密码</label><input type="password" id="pw2" placeholder="再次输入密码" autocomplete="new-password"></div>
<button type="button" id="btn">设置密码</button>
<div class="msg" id="msg"></div>
</div>
<script>
var btn=document.getElementById("btn"),pw=document.getElementById("pw"),pw2=document.getElementById("pw2"),msg=document.getElementById("msg");
btn.onclick=function(){
  var v=pw.value,v2=pw2.value;
  if(!v||v.length<8){msg.className="msg err";msg.textContent="密码至少 8 位";return}
  if(v!==v2){msg.className="msg err";msg.textContent="两次密码不一致";return}
  btn.disabled=true;btn.textContent="设置中...";msg.textContent="";
  var xhr=new XMLHttpRequest();
  xhr.open("POST","/api/admin/setup",true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onload=function(){
    btn.disabled=false;btn.textContent="设置密码";
    if(xhr.status===200){msg.className="msg ok";msg.textContent="密码设置成功！即将跳转到登录页面...";setTimeout(function(){window.location.href="/admin/login"},1500)}
    else{var d=JSON.parse(xhr.responseText);msg.className="msg err";msg.textContent=d.error||"设置失败"}
  };
  xhr.onerror=function(){btn.disabled=false;btn.textContent="设置密码";msg.className="msg err";msg.textContent="连接失败"};
  xhr.send(JSON.stringify({password:v}));
};
pw2.onkeydown=function(e){if(e.key==="Enter")btn.onclick()};
</script></body></html>
