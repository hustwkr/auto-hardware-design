<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8">
<link rel="icon" type="image/png" href="/hwlogo.png">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>管理员登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;border-radius:12px;padding:24px 32px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:360px}
h1{font-size:1.2rem;margin-bottom:20px;text-align:center;color:#1e293b}
.form-group{margin-bottom:16px}
label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.9rem}
input:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
button{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:.95rem;cursor:pointer;margin-top:4px}
button:hover{background:#1d4ed8}
button:disabled{opacity:.6;cursor:not-allowed}
.error{color:#ef4444;font-size:.85rem;margin-top:8px;text-align:center}
</style></head>
<body>
<div class="card">
<h1>管理员登录</h1>
<div class="form-group"><label>用户名</label><input type="text" id="username" placeholder="输入用户名" autofocus></div>
<div style="position:absolute;left:-9999px" aria-hidden="true"><input type="password" tabindex="-1" autocomplete="off"></div>
<div class="form-group"><label>密码</label><input type="password" id="password" placeholder="输入管理员密码" autocomplete="new-password"></div>
<button type="button" id="loginBtn">登录</button>
<div class="error" id="eMsg"></div>
</div>
<script>
var btn=document.getElementById("loginBtn");
var pw=document.getElementById("password");
var msg=document.getElementById("eMsg");

function doLogin(){
  var usr=document.getElementById("username").value;if(!usr){msg.textContent="请输入用户名";return}
if(!pw.value){msg.textContent="请输入密码";return}
  btn.disabled=true;btn.textContent="登录中...";msg.textContent="";
  var xhr=new XMLHttpRequest();
  xhr.open("POST","/api/login",true);
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onload=function(){
    btn.disabled=false;btn.textContent="登录";
    if(xhr.status===200){
      var d=JSON.parse(xhr.responseText);
      localStorage.setItem("admin_token",d.token);
      window.location.href="/admin";
    }else msg.textContent="密码错误";
  };
  xhr.onerror=function(){btn.disabled=false;btn.textContent="登录";msg.textContent="连接失败"};
  xhr.send(JSON.stringify({username:usr,password:pw.value}));
}
btn.onclick=doLogin;
pw.onkeydown=function(e){if(e.key==="Enter")doLogin()};

// Clear password field on load to prevent autofill
window.addEventListener("load",function(){document.getElementById("password").value=""});
</script></body></html>
