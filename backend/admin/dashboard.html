<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8">
<link rel="icon" type="image/png" href="/hwlogo.png">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>默认值管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b}
.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.nav h1{font-size:1.1rem;font-weight:600}
.nav a{color:#64748b;text-decoration:none;font-size:.85rem;margin-left:16px;cursor:pointer}
.nav a:hover{color:#2563eb}
.container{max-width:1000px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:20px 24px;margin-bottom:20px}
.card h2{font-size:1rem;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #e2e8f0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgl{display:flex;flex-direction:column}
.fgl label{font-size:.8rem;font-weight:500;color:#64748b;margin-bottom:2px}
.fgl input,.fgl select{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.88rem}
.fgl input:focus,.fgl select:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.tab-nav{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:10px 20px;border:none;background:transparent;font-size:.9rem;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab-btn.active{color:#2563eb;border-bottom-color:#2563eb;background:#f0f4ff}
.tab{display:none}
.tab.active{display:block}
textarea{width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px;font-family:monospace;font-size:.85rem;min-height:200px;resize:vertical}
.btn-bar{display:flex;gap:10px;margin-top:16px}
.btn{padding:8px 20px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;cursor:pointer;font-size:.88rem}
.btn:hover{background:#f1f5f9}
.btn-p{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-p:hover{background:#1d4ed8}
.status{margin-top:10px;font-size:.85rem;color:#10b981}
.fb-table{width:100%;border-collapse:collapse;font-size:.85rem}
.fb-table th,.fb-table td{padding:8px 10px;text-align:left;border-bottom:1px solid #e2e8f0;vertical-align:top}
.fb-table th{background:#f8fafc;font-weight:600;color:#64748b;font-size:.8rem}
.fb-table tr:hover{background:#f8fafc}
.fb-table .unread{font-weight:600;background:#eff6ff}
.fb-content{max-width:400px;white-space:pre-wrap;word-break:break-word;font-size:.82rem;color:#475569;line-height:1.4}
.fb-time{font-size:.78rem;color:#94a3b8;white-space:nowrap}
.fb-badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:600}
.fb-badge.new{background:#dbeafe;color:#1e40af}
.fb-badge.read{background:#f1f5f9;color:#94a3b8}
.fb-empty{padding:40px;text-align:center;color:#94a3b8;font-size:.9rem}
</style></head>
<body>
<div class="nav"><h1>默认值管理后台</h1><span><a href="/">返回工具</a><a href="/admin/change-password">修改密码</a><a onclick="logout()">退出登录</a></span></div>
<div class="container">
<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('capacitor')">电解电容寿命计算</button>
  <button class="tab-btn" onclick="switchTab('safety')">安规距离计算</button>
  <button class="tab-btn" onclick="switchTab('filter')">信号滤波器设计</button>
  <button class="tab-btn" onclick="switchTab('pcb')">PCB走线载流计算</button>
  <button class="tab-btn" onclick="switchTab('feedback')">意见反馈</button>
</div>

<div id="tab-filter" class="tab">
<div class="card"><h2>滤波器设计参数</h2><div class="fg">
<div class="fgl"><label>滤波器类型</label><select id="filterType"><option value="diff1">一阶差分 (Differential LPF)</option><option value="mfb2" selected>二阶MFB (Multiple Feedback LPF)</option></select></div>
<div class="fgl"><label>电阻精度系列</label><select id="filterSeries"><option value="e24" selected>E24 (5%)</option><option value="e48">E48 (2%)</option></select></div>
<div class="fgl"><label>截止频率 (Hz)</label><input type="number" id="filterFc" value="1000"></div>
<div class="fgl"><label>直流增益 (V/V)</label><input type="number" id="filterGain" value="1"></div>
<div class="fgl"><label>Q值</label><input type="number" id="filterQ" value="0.707" step="0.001"></div>
</div></div>
<div class="btn-bar">
<button class="btn btn-p" onclick="saveDefaults()">保存默认值</button>
<button class="btn" onclick="loadCurrent()">重新加载</button>
<span class="status" id="status"></span>
</div>
</div>

<div id="tab-pcb" class="tab">
<div class="card"><h2>PCB走线参数</h2><div class="fg">
<div class="fgl"><label>走线宽度 (mm)</label><input type="number" id="pcbWidth" value="0.25" step="0.01"></div>
<div class="fgl"><label>铜厚 (oz)</label><select id="pcbCopper"><option value="0.5">0.5 oz</option><option value="1" selected>1 oz</option><option value="2">2 oz</option><option value="3">3 oz</option></select></div>
<div class="fgl"><label>走线位置</label><select id="pcbPos"><option value="external" selected>外层</option><option value="internal">内层</option></select></div>
<div class="fgl"><label>允许温升 (°C)</label><input type="number" id="pcbDeltaT" value="10"></div>
<div class="fgl"><label>环境温度 (°C)</label><input type="number" id="pcbAmbTemp" value="25"></div>
<div class="fgl"><label>走线长度 (mm)</label><input type="number" id="pcbLength" value="50"></div>
<div class="fgl"><label>目标电流 (A)</label><input type="number" id="pcbTargetI" value="0"></div>
</div></div>
<div class="btn-bar"><button class="btn btn-p" onclick="saveDefaults()">保存默认值</button><button class="btn" onclick="loadCurrent()">重新加载</button><span class="status" id="status"></span></div>
</div>

<div id="tab-capacitor" class="tab active">
<div class="card"><h2>电容器额定参数</h2><div class="fg">
<div class="fgl"><label>额定寿命 L0 (h)</label><input type="number" id="l0" value="2000"></div>
<div class="fgl"><label>Tmax (C)</label><input type="number" id="tmax" value="105"></div>
<div class="fgl"><label>Vrated (V)</label><input type="number" id="vrated" value="50"></div>
<div class="fgl"><label>Irated (mA)</label><input type="number" id="irated" value="500"></div>
<div class="fgl"><label>DT0 (C)</label><input type="number" id="dt0" value="10"></div>
<div class="fgl"><label>散热</label><select id="cooling"><option value="1.0">自然对流</option><option value="1.15">风冷1-2m/s</option><option value="1.30">风冷>2m/s</option></select></div>
<div class="fgl"><label>年工作天数</label><input type="number" id="workdays" value="365"></div>
<div class="fgl"><label>质保期 (年)</label><input type="number" id="warrantyTarget" value="5"></div>
<div class="fgl"><label>应用场景</label><select id="scenario"><option value="none">无额外余量</option><option value="consumer">消费电子</option><option value="industrial" selected>工业设备</option><option value="automotive">汽车电子</option><option value="medical">医疗设备</option></select></div>
<div class="fgl"><label>电容类型</label><select id="capType"><option value="lv" selected>低压引线/贴片型</option><option value="hv">高压牛角/螺栓型</option><option value="manual">手动设置 Kv 参数</option></select></div>
<div class="fgl"><label>Kv 参数 a</label><input type="number" id="kva" value="0.56" min="0" max="5" step="0.01"></div>
<div class="fgl"><label>Kv 参数 b</label><input type="number" id="kvb" value="1.0" min="0" max="5" step="0.1"></div>
</div></div>
<div class="card"><h2>运行工况剖面 (JSON)</h2><p style="font-size:.82rem;color:#64748b;margin-bottom:8px">每段: dur(h/天), ta(环温℃), vop(工作电压V), rips([{freq, current}])</p><textarea id="segmentsJson"></textarea></div>
<div class="btn-bar">
<button class="btn btn-p" onclick="saveDefaults()">保存默认值</button>
<button class="btn" onclick="loadCurrent()">重新加载</button>
<span class="status" id="status"></span>
</div>
</div>

<div id="tab-safety" class="tab">
<div class="card"><h2>标准与基础参数</h2><div class="fg">
<div class="fgl"><label>标准体系</label><select id="sStd"><option value="iec">IEC 62109-1</option><option value="ul">UL 840</option></select></div>
<div class="fgl"><label>污染等级</label><select id="sPd"><option value="1">PD 1</option><option value="2" selected>PD 2</option><option value="3">PD 3</option></select></div>
<div class="fgl"><label>材料组别 (CTI)</label><select id="sMg"><option value="i">I 组</option><option value="ii" selected>II 组</option><option value="iiia">IIIa 组</option><option value="iiib">IIIb 组</option></select></div>
<div class="fgl"><label>海拔</label><select id="sAlt"><option value="2000" selected><=2000m</option><option value="3000">2000-3000m</option><option value="4000">3000-4000m</option><option value="5000">4000-5000m</option></select></div>
<div class="fgl"><label>隔离类型</label><select id="sIsolation"><option value="isolated" selected>有隔离 (变压器/光耦)</option><option value="non-isolated">无隔离</option></select></div>
<div class="fgl"><label>AC侧过电压类别</label><select id="sOvc_AC"><option value="i">I</option><option value="ii" selected>II</option><option value="iii">III</option><option value="iv">IV</option></select></div>
<div class="fgl"><label>DC侧过电压类别</label><select id="sOvc_DC"><option value="i">I</option><option value="ii" selected>II</option><option value="iii">III</option><option value="iv">IV</option></select></div>
<div class="fgl"><label>AC系统电压 (V)</label><input type="number" id="sSysV_AC" value="300"></div>
<div class="fgl"><label>DC系统电压 (V)</label><input type="number" id="sSysV_DC" value="600"></div>
</div></div>
<div class="card"><h2>测量节点定义 (JSON)</h2><p style="font-size:.82rem;color:#64748b;margin-bottom:8px">每节点: name, vrms, ins, pcb, coat, circ, interp</p><textarea id="nodesJson"></textarea></div>
<div class="btn-bar">
<button class="btn btn-p" onclick="saveDefaults()">保存默认值</button>
<button class="btn" onclick="loadCurrent()">重新加载</button>
<span class="status" id="status"></span>
</div>
</div><!-- /tab-safety -->

<div id="tab-feedback" class="tab">
<div class="card"><h2 style="display:flex;align-items:center;justify-content:space-between">意见反馈 <span id="fbCount" style="font-size:.8rem;font-weight:400;color:#94a3b8"></span></h2>
<div id="fbList"></div>
</div>
</div><!-- /tab-feedback -->

<script>
var token = localStorage.getItem("admin_token");
if(!token){var m=document.cookie.match(/token=([^;]+)/);if(m){localStorage.setItem("admin_token",m[1]);token=m[1]}}
if(!token){ window.location.href="/admin/login?e=2"; }

function logout(){ localStorage.removeItem("admin_token"); window.location.href="/admin/login"; }
function switchTab(t){
  document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active")});
  document.querySelectorAll(".tab").forEach(function(tb){tb.classList.remove("active")});
  document.querySelector("[onclick*='"+t+"']").classList.add("active");
  document.getElementById("tab-"+t).classList.add("active");
  if(t==="feedback")loadFeedback();
}
function authFetch(url,opt){ opt=opt||{}; opt.headers=opt.headers||{}; opt.headers["x-auth-token"]=token; return fetch(url,opt); }
function showStatus(msg,color){ var el=document.getElementById("status"); el.textContent=msg; el.style.color=color||"#10b981"; setTimeout(function(){el.textContent=""},3000); }

async function loadCurrent(){
  var r=await authFetch("/api/admin/defaults");
  if(r.status===401){ alert("登录已过期，请重新登录"); localStorage.removeItem("admin_token"); window.location.href="/admin/login"; return; }
  if(!r.ok){ showStatus("加载失败","#ef4444"); return; }
  var d=await r.json();
  if(d.capacitor){
    var c=d.capacitor;
    ["l0","tmax","vrated","irated","dt0","workdays","warrantyTarget","kva","kvb"].forEach(function(k){var el=document.getElementById(k);if(el)el.value=c[k]||""});
    document.getElementById("cooling").value=c.cooling||"1.0";
    document.getElementById("scenario").value=c.scenario||"industrial";
    document.getElementById("capType").value=c.capType||"lv";
    document.getElementById("segmentsJson").value = JSON.stringify(c.segments || [], null, 2);
  }
  if(d.safety){
    var s=d.safety;
    ["sStd","sPd","sMg","sAlt","sIsolation","sOvc_AC","sOvc_DC","sSysV_AC","sSysV_DC"].forEach(function(k){var el=document.getElementById(k);if(el)el.value=s[k]||""});
    document.getElementById("nodesJson").value=JSON.stringify(s.nodes||[],null,2);
  }
  if(d.filter){
    var f=d.filter;
    ["filterType","filterSeries","filterFc","filterGain","filterQ"].forEach(function(k){var el=document.getElementById(k);if(el)el.value=f[k]||""});
  }
  if(d.pcb){
    var p=d.pcb;
    ["pcbWidth","pcbCopper","pcbPos","pcbDeltaT","pcbAmbTemp","pcbLength","pcbTargetI"].forEach(function(k){var el=document.getElementById(k);if(el)el.value=p[k]||""});
  }
  showStatus("已加载");
}

async function saveDefaults(){
  var d={capacitor:{},safety:{},filter:{},pcb:{}};
  ["l0","tmax","vrated","irated","dt0","workdays","warrantyTarget","kva","kvb"].forEach(function(k){d.capacitor[k]=document.getElementById(k).value});
  d.capacitor.cooling=document.getElementById("cooling").value;
  d.capacitor.scenario=document.getElementById("scenario").value;
  d.capacitor.capType=document.getElementById("capType").value;
  try{ d.capacitor.segments = JSON.parse(document.getElementById("segmentsJson").value); }catch(e){ showStatus("运行段JSON错误: "+e.message,"#ef4444"); return; }

  ["sStd","sPd","sMg","sAlt","sIsolation","sOvc_AC","sOvc_DC","sSysV_AC","sSysV_DC"].forEach(function(k){d.safety[k]=document.getElementById(k).value});
  try{ d.safety.nodes=JSON.parse(document.getElementById("nodesJson").value); }catch(e){ showStatus("节点定义JSON错误: "+e.message,"#ef4444"); return; }

  ["filterType","filterSeries","filterFc","filterGain","filterQ"].forEach(function(k){d.filter[k]=document.getElementById(k).value});

  d.pcb={};
  ["pcbWidth","pcbCopper","pcbPos","pcbDeltaT","pcbAmbTemp","pcbLength","pcbTargetI"].forEach(function(k){d.pcb[k]=document.getElementById(k).value});

  var r=await authFetch("/api/admin/defaults",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
  if(r.status===401){ alert("登录已过期"); localStorage.removeItem("admin_token"); window.location.href="/admin/login"; return; }
  if(r.ok) showStatus("保存成功");
    else { var msg="保存失败"; try{var j=await r.text();msg+=" ("+r.status+": "+j+")";}catch(e){} showStatus(msg,"#ef4444"); }
}

async function loadFeedback(){
  var el=document.getElementById("fbList"); if(!el)return;
  el.innerHTML='<p style="padding:20px;text-align:center;color:#94a3b8">加载中...</p>';
  var r=await authFetch("/api/feedback");
  if(r.status===401){ alert("登录已过期"); localStorage.removeItem("admin_token"); window.location.href="/admin/login"; return; }
  if(!r.ok){ el.innerHTML='<p class="fb-empty">加载失败</p>'; return; }
  var data=await r.json();
  document.getElementById("fbCount").textContent='共 '+data.length+' 条';
  if(!data.length){ el.innerHTML='<p class="fb-empty">暂无意见反馈</p>'; return; }
  var html='<table class="fb-table"><thead><tr><th style="width:40px">状态</th><th style="width:100px">姓名</th><th style="width:160px">标题</th><th>内容</th><th style="width:140px">时间</th><th style="width:60px">操作</th></tr></thead><tbody>';
  data.sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp)});
  data.forEach(function(fb){
    var cls=fb.read?'':'unread';
    var badge=fb.read?'<span class="fb-badge read">已读</span>':'<span class="fb-badge new">未读</span>';
    var time=new Date(fb.timestamp).toLocaleString('zh-CN');
    var content=fb.content||'';
    if(content.length>200)content=content.substring(0,200)+'...';
    html+='<tr class="'+cls+'"><td>'+badge+'</td><td>'+escapeHtml(fb.name)+'</td><td><strong>'+escapeHtml(fb.title)+'</strong></td><td><div class="fb-content">'+escapeHtml(content)+'</div></td><td class="fb-time">'+time+'</td>';
    if(!fb.read) html+='<td><button class="btn" style="padding:2px 8px;font-size:.78rem" onclick="markRead(\''+fb.id+'\')">标为已读</button></td>';
    else html+='<td></td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}

async function markRead(id){
  var r=await authFetch("/api/feedback",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,read:true})});
  if(r.ok) loadFeedback();
}

function escapeHtml(s){if(!s)return '';return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

loadCurrent();

</script></body></html>
