[permissions]
allow = ["Bash=node -e \"\nvar PM = require('./js/models/pcb-model.js');\n// We can't require IIFE modules directly, let me just simulate\nvar OZ_TO_MIL=1.378, MIL_TO_MM=0.0254;\nvar CONST={external:{K:0.048,b:0.44,c:0.725},internal:{K:0.024,b:0.44,c:0.725}};\n\nfunction viaArea(drillMm,wallUm){\n  var tw=wallUm/1000, rInner=drillMm/2, rOuter=rInner+tw;\n  return Math.PI*(rOuter*rOuter-rInner*rInner);\n}\nfunction calcViaCurrent(p){\n  var area=viaArea(p.drillMm,p.wallUm), areaMil2=area/(MIL_TO_MM*MIL_TO_MM);\n  var c=CONST[p.position]||CONST.external;\n  return {current:Math.round(c.K*Math.pow(p.deltaT,c.b)*Math.pow(areaMil2,c.c)*1000)/1000, areaMm2:Math.round(area*10000)/10000};\n}\n\n// Test: 0.3mm drill, 25μm wall, external, 10°C rise\nvar r=calcViaCurrent({drillMm:0.3,wallUm:25,position:'external',deltaT:10});\nconsole.log('0.3mm via, 25μm wall, ext, ΔT=10:', r.current.toFixed(2), 'A, area:', r.areaMm2.toFixed(4), 'mm²');\n\n// Test: 0.6mm drill  \nvar r2=calcViaCurrent({drillMm:0.6,wallUm:25,position:'external',deltaT:10});\nconsole.log('0.6mm via, 25μm wall, ext, ΔT=10:', r2.current.toFixed(2), 'A, area:', r2.areaMm2.toFixed(4), 'mm²');\n\n// Test: 1.0mm drill\nvar r3=calcViaCurrent({drillMm:1.0,wallUm:35,position:'external',deltaT:20});\nconsole.log('1.0mm via, 35μm wall, ext, ΔT=20:', r3.current.toFixed(2), 'A, area:', r3.areaMm2.toFixed(4), 'mm²');\n\" 2>&1"]
